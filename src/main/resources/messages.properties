# Validacion de formularios
formulario.resena.calificacion=Elige una calificación de 1 a 5 estrellas.
formulario.resena.comentario=El comentario puede tener hasta 300 caracteres.
formulario.registro.nombre=Escribe tu nombre (hasta 80 caracteres).
formulario.registro.alias=El alias debe tener de 3 a 20 caracteres: letras sin tilde, números o guion bajo.
formulario.registro.correo=Escribe un correo válido.
formulario.registro.clave=La clave debe tener de 8 a 72 caracteres, con al menos una letra y un número.
formulario.registro.confirmacion=Las dos claves no coinciden.
formulario.cocina.nombre=Escribe el nombre de la cocina (hasta 80 caracteres).
formulario.cocina.descripcion=Escribe una descripción (hasta 400 caracteres).
formulario.cocina.categoria=Elige una categoría.
formulario.cocina.rareza=Elige una rareza.
formulario.cocina.horario=Indica la hora de apertura y la de cierre.
formulario.cocina.horario-igual=La hora de apertura y la de cierre no pueden ser iguales.
formulario.cocina.latitud=La latitud debe estar entre 7,80 y 8,00 (área urbana de Cúcuta).
formulario.cocina.longitud=La longitud debe estar entre -72,58 y -72,42 (área urbana de Cúcuta).
formulario.cocina.barrio=Escribe el barrio (hasta 60 caracteres).
formulario.cocina.canales=Marca al menos un canal de pedido.
formulario.reto.titulo=Escribe un título (hasta 80 caracteres).
formulario.reto.descripcion=Escribe una descripción (hasta 240 caracteres).
formulario.reto.meta=La meta debe estar entre 1 y 50 cocinas.
formulario.reto.recompensa=La recompensa debe estar entre 1 y 5.000 puntos.
formulario.reto.fechas=Indica la fecha de inicio y la de fin.
formulario.reto.fechas-orden=La fecha de fin no puede ser anterior a la de inicio.

