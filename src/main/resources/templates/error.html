<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabeza('Algo salió mal')}"></head>
<body>
<header th:replace="~{fragmentos/base :: encabezado}"></header>
<main id="contenido" class="envoltura error-pagina">
  <img th:src="@{/img/logo.svg}" alt="" width="96" height="96">
  <p class="error-pagina__codigo" th:text="'Error ' + ${status}">Error 400</p>
  <h1>Algo salió mal.</h1>
  <p class="entradilla">No pudimos procesar la solicitud. Revisa el enlace o vuelve al inicio.</p>
  <div class="formulario__acciones">
    <a class="boton" th:href="@{/}">Volver al inicio</a>
  </div>
</main>
<footer th:replace="~{fragmentos/base :: pie}"></footer>
</body>
</html>
