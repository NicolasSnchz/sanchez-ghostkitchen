<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<main id="contenido" class="envoltura error-pagina">

  <p class="error-pagina__codigo">Error 404</p>
  <h1>Esta cocina se esfumó.</h1>

    <a class="boton boton--secundario" th:href="@{/}">Volver al inicio</a>

<footer th:replace="~{fragmentos/base :: pie}"></footer>

</html>
