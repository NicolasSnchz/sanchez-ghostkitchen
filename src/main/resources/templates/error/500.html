<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabeza('Error del servidor')}"></head>
<body>
<header th:replace="~{fragmentos/base :: encabezado}"></header>
<main id="contenido" class="envoltura error-pagina">
  <img th:src="@{/img/logo.svg}" alt="" width="96" height="96">
  <p class="error-pagina__codigo">Error 500</p>
  <h1>Se nos quemó la comanda.</h1>
  <p class="entradilla">Ocurrió un error inesperado y no pudimos completar la solicitud. Ya quedó registrado; intenta de nuevo en unos minutos.</p>
  <div class="formulario__acciones">
    <a class="boton" th:href="@{/}">Volver al inicio</a>
  </div>
</main>
<footer th:replace="~{fragmentos/base :: pie}"></footer>
</body>
</html>
