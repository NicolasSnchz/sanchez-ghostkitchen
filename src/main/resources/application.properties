spring.application.name=ghostkitchen-hunter

# Base de datos en memoria: cada arranque parte del catalogo de demostracion.
spring.datasource.url=jdbc:h2:mem:ghostkitchen;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# La interfaz esta en espanol de Colombia sin importar el navegador.
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

spring.thymeleaf.cache=true
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.level.org.hibernate.SQL=warn
