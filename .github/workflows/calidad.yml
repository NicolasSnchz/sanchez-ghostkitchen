name: Calidad con SonarQube y capturas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAVE_SONAR: GhostKitchen-Ci-2026
  PROYECTO: NicolasSnchz_sanchez-ghostkitchen

jobs:
  sonarqube:
    name: Análisis en SonarQube Community
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Levantar SonarQube en un contenedor
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name sonarqube -p 9000:9000 -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:community
          timeout 300 bash -c 'until curl -s localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do sleep 5; done'

      - name: Preparar proyecto, puerta de calidad y token
        run: bash scripts/preparar-sonarqube.sh

      - name: Compilar, probar y analizar
        run: |
          mkdir -p evidencias
          set -o pipefail
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=http://localhost:9000 -Dsonar.token=${{ env.TOKEN_SONAR }} \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600 2>&1 | tee evidencias/build.log

      - name: Reunir reportes de pruebas, cobertura y PMD
        if: always()
        run: |
          mkdir -p evidencias/reportes
          cp -r target/surefire-reports target/failsafe-reports evidencias/reportes/ 2>/dev/null || true
          cp target/site/jacoco/jacoco.csv target/pmd.xml target/cpd.xml evidencias/reportes/ 2>/dev/null || true
          cp -r target/site/jacoco evidencias/reportes/jacoco-html 2>/dev/null || true
          python3 scripts/resumen-pruebas.py --html evidencias/reportes/pruebas.html > evidencias/resumen-pruebas.md || true

      - name: Exportar métricas
        if: always()
        run: bash scripts/exportar-metricas.sh

      - name: Capturas de SonarQube, de las pruebas y de JaCoCo
        if: always()
        run: |
          mkdir -p /tmp/playwright && cd /tmp/playwright
          npm init -y >/dev/null && npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/playwright/node_modules node scripts/capturar-sonarqube.js
          NODE_PATH=/tmp/playwright/node_modules node scripts/capturar-reportes.js

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-sonarqube
          path: evidencias/

  capturas:
    name: Capturas de la aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar y arrancar la aplicación
        run: |
          mkdir -p evidencias
          set -o pipefail
          mvn -B -ntp -DskipTests package 2>&1 | tee evidencias/empaquetado.log
          java -jar target/ghostkitchen-hunter-1.0.0.jar > evidencias/app.log 2>&1 &
          timeout 120 bash -c 'until curl -s -o /dev/null localhost:8080/; do sleep 2; done'

      - name: Recorrer la aplicación con Playwright
        run: |
          mkdir -p /tmp/playwright && cd /tmp/playwright
          npm init -y >/dev/null && npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/playwright/node_modules node scripts/capturar-aplicacion.js

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-aplicacion
          path: evidencias/

  publicar:
    name: Publicar evidencias en la rama evidencias-ci
    needs: [sonarqube, capturas]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: evidencias

      - name: Subir las evidencias de esta ejecución
        env:
          RESULTADO: "sonarqube=${{ needs.sonarqube.result }} capturas=${{ needs.capturas.result }}"
        run: |
          mkdir -p evidencias && cd evidencias
          echo "$RESULTADO commit=$GITHUB_SHA" > estado.txt
          git init -q -b evidencias-ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Evidencias de la ejecucion $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evidencias-ci
