name: Compilación y pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar, probar y revisar umbrales (JaCoCo, PMD, CPD, ArchUnit)
        run: mvn -B -ntp verify

      - name: Guardar reportes
        if: always() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
            target/pmd.xml
            target/cpd.xml
          if-no-files-found: ignore
