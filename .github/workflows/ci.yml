name: Compilación y pruebas

on:
  push:
    # demo/** existe solo para la evidencia de la violacion intencional de ArchUnit (README, Arquitectura).
    branches: [main, 'demo/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar, probar y revisar umbrales (JaCoCo, PMD, CPD, ArchUnit)
        run: mvn -B -ntp verify

      - name: Resumen de pruebas en la página de la ejecución
        if: always()
        run: python3 scripts/resumen-pruebas.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Resumir las pruebas que fallaron
        if: failure()
        run: |
          {
            echo "## Pruebas que fallaron (JDK ${{ matrix.java }})"
            echo
            for reporte in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
              [ -f "$reporte" ] || continue
              if grep -qE "<<< (FAILURE|ERROR)" "$reporte"; then
                echo '```text'
                head -n 60 "$reporte"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
            target/pmd.xml
            target/cpd.xml
          if-no-files-found: ignore
